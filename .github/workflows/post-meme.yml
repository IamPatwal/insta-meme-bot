name: Post meme

on:
  schedule:
    - cron: "30 3 * * *"    # 9:00 AM IST
    - cron: "30 13 * * *"   # 7:00 PM IST
  workflow_dispatch:         # lets you press "Run workflow" yourself

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: Make the meme
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_HANDLE: ${{ secrets.IG_HANDLE }}
        run: python bot.py make
      - name: Save the image to the repo
        run: |
          git config user.name "meme-bot"
          git config user.email "meme-bot@users.noreply.github.com"
          git add images posted.json next_post.json
          git commit -m "new meme" || true
          git push
      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python bot.py post
